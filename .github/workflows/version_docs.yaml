name: Version docs

on:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    version_docs:
        name: Version docs
        runs-on: ubuntu-latest

        outputs:
            sha: ${{ steps.sha.outputs.sha }}
            version: ${{ steps.version.outputs.version }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false

            - name: Record the built commit
              id: sha
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Use Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 26
                  check-latest: true

            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.6.2

            - name: Snapshot the current version
              id: version
              run: |
                  VERSION=$(jq -r '.version' package.json)
                  MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  rm -rf website/versioned_docs/version-$MAJOR_MINOR
                  rm -rf website/versioned_sidebars/version-$MAJOR_MINOR-sidebars.json
                  jq --arg v "$MAJOR_MINOR" 'map(select(. != $v))' website/versions.json > website/tmp.json && mv website/tmp.json website/versions.json
                  pnpm --filter apify-cli-website exec -- docusaurus docs:version $MAJOR_MINOR

            - name: Upload the version snapshot
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: versioned-docs
                  path: |
                      website/versioned_docs
                      website/versioned_sidebars
                      website/versions.json
                  include-hidden-files: true
                  retention-days: 1

    # The service account token is only used in a job that does not run the docs toolchain.
    commit_versioned_docs:
        name: Commit versioned docs
        needs: version_docs
        runs-on: ubuntu-latest
        environment:
            name: npm
            deployment: false

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  fetch-depth: 0
                  persist-credentials: false

            # Start from the commit the snapshot was made on, so the pull below merges it with anything pushed since.
            - name: Reset to the built commit
              run: git reset --hard "$BUILT_SHA"
              env:
                  BUILT_SHA: ${{ needs.version_docs.outputs.sha }}

            - name: Remove the previous snapshot
              run: rm -rf website/versioned_docs website/versioned_sidebars website/versions.json

            - name: Download the version snapshot
              uses: actions/download-artifact@v8.0.2
              with:
                  name: versioned-docs
                  path: website

            - name: Commit and push the version snapshot
              uses: apify/actions/signed-commit@v1.6.2
              with:
                  message: "docs: version docs for ${{ needs.version_docs.outputs.version }} [docs build]"
                  add: 'website/versioned_docs website/versioned_sidebars website/versions.json'
                  pull: '--rebase --autostash'
                  github-token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
