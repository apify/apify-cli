name: Create a pre-release

on:
    # Push to master will deploy a beta version
    push:
        branches:
            - master
        tags-ignore:
            - "**" # Ignore all tags to prevent duplicate builds when tags are pushed.

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release_metadata:
        if: "!startsWith(github.event.head_commit.message, 'docs') && startsWith(github.repository, 'apify/')"
        name: Prepare release metadata
        runs-on: ubuntu-latest
        outputs:
            version_number: ${{ steps.release_metadata.outputs.version_number }}
            changelog: ${{ steps.release_metadata.outputs.changelog }}
            release_notes: ${{ steps.release_metadata.outputs.release_notes }}
        steps:
            - uses: apify/actions/git-cliff-release@v1.3.0
              name: Prepare release metadata
              id: release_metadata
              with:
                  release_type: prerelease
                  existing_changelog_path: CHANGELOG.md

    wait_for_checks:
        name: Wait for code checks to pass
        runs-on: ubuntu-latest
        steps:
            - uses: lewagon/wait-on-check-action@96d9100b431964d10e0136aff8b9ccb92470505e # v1.8.0
              with:
                  ref: ${{ github.sha }}
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  check-regexp: (Build|Lint.*|(Local|API) Tests.*|Python Support.*|Docs build)
                  wait-interval: 5

    update_changelog:
        needs: [release_metadata, wait_for_checks]
        name: Update changelog
        runs-on: ubuntu-latest
        outputs:
            changelog_commitish: ${{ steps.commit.outputs.commit_long_sha }}
            pre_release_version: ${{ steps.get-pre-release-version.outputs.pre_release_version }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.3.1

            - name: Update package version in package.json
              run: pnpm version ${{ needs.release_metadata.outputs.version_number }} --no-git-tag-version --allow-same-version

            - name: Format
              run: pnpm install && pnpm run format:fix

            - name: Commit changes
              id: commit
              uses: apify/actions/signed-commit@v1.3.0
              with:
                  message: "chore(release): Update changelog and package version [skip ci]"
                  pull: '--rebase --autostash'
                  github-token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

            - name: Get pre-release version
              id: get-pre-release-version
              run: |
                  pnpm exec tsx ./.github/scripts/before-beta-release.ts
                  echo "pre_release_version=$(cat package.json | jq -r '.version')" >> $GITHUB_OUTPUT

    build-bundles:
        name: Build bundles
        needs: [release_metadata, update_changelog]

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: unix
                    - os: windows-latest
                      label: windows-x64
                      bun-target-arch: x64
                    - os: windows-11-arm
                      label: windows-arm64
                      bun-target-arch: arm64

        runs-on: ${{ matrix.os }}
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.update_changelog.outputs.changelog_commitish }}
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.3.1

            - name: Install bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            # https://github.com/oven-sh/bun/issues/11198
            - name: Fix cross-platform building on Actions
              if: ${{ matrix.os != 'ubuntu-latest' }}
              run: |
                  mkdir C:\test
                  cd C:\test
                  bun init -y
                  bun build --compile --target=bun-windows-${{ matrix.bun-target-arch }} --outfile test index.ts
                  if ("${{ matrix.bun-target-arch }}" -eq "x64") {
                      bun build --compile --target=bun-windows-x64-baseline --outfile test index.ts
                  }

            - name: Set pre-release version
              run: pnpm version ${{ needs.update_changelog.outputs.pre_release_version }} --no-git-tag-version --allow-same-version

            - name: Build Bundles
              run: pnpm run insert-cli-metadata && pnpm run build-bundles

            - name: Upload bundles
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: apify-cli-bundles-${{ matrix.label }}
                  path: bundles/**

    create_github_release:
        name: Create GitHub release
        needs: [release_metadata, update_changelog, build-bundles]
        runs-on: ubuntu-latest

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.update_changelog.outputs.changelog_commitish }}

            # This step also deals with unzipping the archive from GitHub, so we get a big folder with all the bundles!
            - name: Download bundles
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: apify-cli-bundles-*
                  merge-multiple: true
                  path: bundles

            - name: List bundles
              run: |
                  ls -la bundles

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.3.1

            - name: Set pre-release version
              run: pnpm version ${{ needs.update_changelog.outputs.pre_release_version }} --no-git-tag-version --allow-same-version --no-git-checks

            - name: Report install size
              id: install-size
              run: node scripts/report-install-size.mjs

            - name: Create release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  tag_name: v${{ needs.update_changelog.outputs.pre_release_version }}
                  name: ${{ needs.update_changelog.outputs.pre_release_version }}
                  target_commitish: ${{ needs.update_changelog.outputs.changelog_commitish }}
                  body: |
                      ${{ needs.release_metadata.outputs.release_notes }}

                      ${{ steps.install-size.outputs.report }}
                  prerelease: true
                  files: |
                      bundles/*

    publish_to_npm:
        name: Publish to NPM
        needs: [update_changelog]
        runs-on: ubuntu-latest

        steps:
            - name: Execute publish workflow
              uses: apify/actions/execute-workflow@v1.3.0
              with:
                  workflow: publish_to_npm.yaml
                  inputs: >
                      {
                          "ref": "${{ needs.update_changelog.outputs.changelog_commitish }}",
                          "tag": "beta"
                      }
