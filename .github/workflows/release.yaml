name: Create a release

on:
    # Trigger a stable version release via GitHub's UI, with the ability to specify the type of release.
    workflow_dispatch:
        inputs:
            release_type:
                description: Release type
                required: true
                type: choice
                default: auto
                options:
                    - auto
                    - custom
                    - patch
                    - minor
                    - major
            custom_version:
                description: The custom version to bump to (only for "custom" type)
                required: false
                type: string
                default: ""

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release_metadata:
        name: Prepare release metadata
        runs-on: ubuntu-latest
        outputs:
            version_number: ${{ steps.release_metadata.outputs.version_number }}
            tag_name: ${{ steps.release_metadata.outputs.tag_name }}
            changelog: ${{ steps.release_metadata.outputs.changelog }}
            release_notes: ${{ steps.release_metadata.outputs.release_notes }}
        steps:
            - uses: apify/actions/git-cliff-release@v1.3.0
              name: Prepare release metadata
              id: release_metadata
              with:
                  release_type: ${{ inputs.release_type }}
                  custom_version: ${{ inputs.custom_version }}
                  existing_changelog_path: CHANGELOG.md

    # If github.ref points to a [skip ci] commit, we assume that it was added by the pre_release workflow,
    # which doesn't push the commit if code checks don't pass.
    # Otherwise, the checks will have been triggered by the `run_code_checks` workflow.
    wait_for_checks:
        name: Wait for code checks to pass
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Check if the head commit contains [skip ci]
              id: check_skip
              run: |
                  if git log --format=%B -n 1 ${{ github.sha }} | head -n 1 | grep '\[skip ci\]$'; then
                    echo 'skipped=true' >> $GITHUB_OUTPUT
                  else
                    echo 'skipped=false' >> $GITHUB_OUTPUT
                  fi

            - uses: lewagon/wait-on-check-action@96d9100b431964d10e0136aff8b9ccb92470505e # v1.8.0
              if: ${{ steps.check_skip.outputs.skipped == 'false' }}
              with:
                  ref: ${{ github.sha }}
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  check-regexp: (Build|(Local|API) Tests.*|Python Support.*|Docs build)
                  wait-interval: 5

    update_changelog:
        needs: [release_metadata, wait_for_checks]
        name: Update changelog
        runs-on: ubuntu-latest
        outputs:
            changelog_commitish: ${{ steps.commit.outputs.commit_long_sha }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.3.1

            - name: Update package version in package.json
              run: pnpm version ${{ needs.release_metadata.outputs.version_number }} --no-git-tag-version --allow-same-version

            - name: Update README
              run: pnpm pack

            - name: Update CHANGELOG.md
              uses: DamianReeves/write-file-action@d4ee8a06aec5db0c57a036b86f2f428e1f8b00e7 # master
              with:
                  path: CHANGELOG.md
                  write-mode: overwrite
                  contents: ${{ needs.release_metadata.outputs.changelog }}

            - name: Format
              run: pnpm run format:fix

            - name: Ignore changes to useCLIMetadata.ts
              run: |
                  git update-index --assume-unchanged src/lib/hooks/useCLIMetadata.ts

            - name: Commit changes
              id: commit
              uses: apify/actions/signed-commit@v1.3.0
              with:
                  message: "chore(release): Update changelog and package version [skip ci]"
                  pull: '--rebase --autostash'
                  github-token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

    build-bundles:
        name: Build bundles
        needs: [release_metadata, update_changelog]

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: unix
                    - os: windows-latest
                      label: windows-x64
                      bun-target-arch: x64
                    - os: windows-11-arm
                      label: windows-arm64
                      bun-target-arch: arm64

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.update_changelog.outputs.changelog_commitish }}
                  fetch-depth: 0

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.3.1

            - name: Install bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version-file: .bun-version

            # https://github.com/oven-sh/bun/issues/11198
            - name: Fix cross-platform building on Actions
              if: ${{ matrix.os != 'ubuntu-latest' }}
              run: |
                  mkdir C:\test
                  cd C:\test
                  bun init -y
                  bun build --compile --target=bun-windows-${{ matrix.bun-target-arch }} --outfile test index.ts
                  if ("${{ matrix.bun-target-arch }}" -eq "x64") {
                      bun build --compile --target=bun-windows-x64-baseline --outfile test index.ts
                  }

            - name: Set version
              run: pnpm version ${{ needs.release_metadata.outputs.version_number }} --no-git-tag-version --allow-same-version

            - name: Build Bundles
              run: pnpm run insert-cli-metadata && pnpm run build-bundles

            - name: Upload bundles
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: apify-cli-bundles-${{ matrix.label }}
                  path: bundles/**

    create_github_release:
        name: Create GitHub release
        needs: [release_metadata, update_changelog, build-bundles]
        runs-on: ubuntu-latest

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.update_changelog.outputs.changelog_commitish }}

            # This step also deals with unzipping the archive from GitHub, so we get a big folder with all the bundles!
            - name: Download bundles
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: apify-cli-bundles-*
                  merge-multiple: true
                  path: bundles

            - name: List bundles
              run: |
                  ls -la bundles

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24

            - name: Install pnpm and dependencies
              uses: apify/actions/pnpm-install@v1.3.1

            - name: Report install size
              id: install-size
              run: node scripts/report-install-size.mjs

            - name: Create release
              uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
              with:
                  tag_name: ${{ needs.release_metadata.outputs.tag_name }}
                  name: ${{ needs.release_metadata.outputs.version_number }}
                  target_commitish: ${{ needs.update_changelog.outputs.changelog_commitish }}
                  body: |
                      ${{ needs.release_metadata.outputs.release_notes }}

                      ${{ steps.install-size.outputs.report }}
                  files: |
                      bundles/*

    publish_to_npm:
        name: Publish to NPM
        needs: [update_changelog, create_github_release]
        runs-on: ubuntu-latest
        steps:
            - name: Execute publish workflow
              uses: apify/actions/execute-workflow@v1.3.0
              with:
                  workflow: publish_to_npm.yaml
                  inputs: >
                      {
                          "ref": "${{ needs.update_changelog.outputs.changelog_commitish }}",
                          "tag": "latest"
                      }

    version_docs:
        name: Version docs
        needs: [update_changelog, publish_to_npm]
        uses: ./.github/workflows/version_docs.yaml
        secrets: inherit

    update_homebrew_formula:
        name: Update Homebrew Formula
        needs: [update_changelog, publish_to_npm]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.update_changelog.outputs.changelog_commitish }}

            - name: Set git identity
              run: |
                  git config --global user.name 'Apify Service Account'
                  git config --global user.email 'apify-service-account@users.noreply.github.com'

            - name: Set up Homebrew
              uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # master

            # It can happen that the updated package version is not available right after the `npm publish` command finishes
            # Try waiting 3 minutes until the updated package version is available
            - name: Wait for updated package to be available on NPM
              run: |
                  PACKAGE_VERSION=`node -p "require('./package.json').version"`
                  PACKAGE_DEFINITION_URL="https://registry.npmjs.org/apify-cli/${PACKAGE_VERSION}"

                  for _i in {1..30}; do
                      curl -sf "${PACKAGE_DEFINITION_URL}" &> /dev/null && exit 0;
                      echo "Package 'apify-cli' version '${PACKAGE_VERSION}' is not available yet, will retry in 10 seconds."
                      sleep 10;
                  done
                  curl -sf "${PACKAGE_DEFINITION_URL}" &> /dev/null || exit 1;

            - name: Update Homebrew formula in apify/homebrew-tap repo
              run: |
                  PACKAGE_VERSION=`node -p "require('./package.json').version"`
                  gh workflow run update_formula.yaml --repo apify/homebrew-tap --field package=apify-cli --field version=$PACKAGE_VERSION
              env:
                  GH_TOKEN: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

            - name: Send PR with formula update to homebrew/homebrew-core repo
              run: |
                  PACKAGE_VERSION=`node -p "require('./package.json').version"`
                  brew tap --force homebrew/core
                  brew bump-formula-pr apify-cli \
                      --version ${PACKAGE_VERSION} \
                      --no-browse \
                      --message "Automatic update of the \`apify-cli\` formula. CC @B4nan @vladfrangu"
              env:
                  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
