StylesPath = .github/vale/styles
MinAlertLevel = error
Packages = https://github.com/apify/vale-rules/releases/download/v1.0.0/ApifyStyleGuide.zip

# The reference is rendered as `sh` fences; Vale skips `pre` by default.
SkippedScopes = script, style, figure
IgnoredScopes = tt

# ApifyCli.Contractions adds what Apify.Contractions misses: capitalized forms
# and phrases split by the 80-column wrap.
[docs/reference.md]
BasedOnStyles = ApifyCli
Apify.Contractions = error
